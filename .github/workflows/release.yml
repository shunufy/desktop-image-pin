name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DesktopImagePin.sln --locked-mode

      - name: Build and test
        run: |
          dotnet build DesktopImagePin.sln -c Release --no-restore -warnaserror
          dotnet test DesktopImagePin.sln -c Release --no-build

      - name: Publish Windows x64
        run: >
          dotnet publish DesktopImagePin.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          publish/win-x64/DesktopImagePin.exe
          --repo "${{ github.repository }}"
          --title "Desktop Image Pin ${{ github.ref_name }}"
          --generate-notes
